</style></head><body><header><div class="top"><div class="brand"><div class="logo">A</div><div><strong>ALMA Match</strong><small>Tu plan. Tu comparación. Tu decisión.</small></div></div><span class="badge-demo">DEMO HACKATHON v0.6</span></div></header><div class="wrap"><main class="workspace"><div class="bar"><div id="prog"></div></div><div class="progresslabel" id="proglabel"></div><section class="content" id="content" aria-live="polite"></section></main></div><footer>Demostración técnica independiente de WordPress. Documentos de prueba sin información personal. Datos de extracción y coberturas pendientes de validación. No constituye oferta comercial ni asesoría médica.</footer><script>(() => {
'use strict';
const $=id=>document.getElementById(id);
const s={stage:0,age:'',isapre:'Esencial',loads:'',pactUF:'',income:'',payment:'',goal:'ambas',clinics:['Clínica Dávila','Clínica Indisa'],other:'',file:null,response:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
const formatThousands=v=>{const d=String(v??'').replace(/\D/g,'');return d?Number(d).toLocaleString('es-CL'):''};
const digitValue=v=>Number(String(v||'').replace(/\D/g,''));
const uf=n=>Number.isFinite(+n)&&n!==null?Number(n).toLocaleString('es-CL',{minimumFractionDigits:3,maximumFractionDigits:3})+' UF':'Pendiente';
const BACK='<button id="back" type="button" class="ghost">Volver</button>';
const NEXT=t=>'<button id="next" type="button" class="primary">'+esc(t||'Continuar')+' →</button>';
const view=(title,lead,body,actions)=>`<div class="eyebrow">ALMA · Asesoría inteligente</div><h1 class="hero">${title}</h1><p class="lead">${lead}</p>${body}<p class="err" id="err" role="alert"></p><div class="actions">${actions||''}</div>`;
const err=(msg,id)=>{if($('err'))$('err').textContent=msg;if(id&&$(id))$(id).focus()};
function persist() {
  if(s.stage===0){
    s.age=$('age')?.value||'';s.isapre=$('isapre')?.value||'';s.loads=$('loads')?.value||'';
    s.pactUF=$('pactUF')?.value||'';s.income=$('income')?.value||'';s.payment=$('payment')?.value||'';
  }
  if(s.stage===1){s.other=$('other')?.value||''}
}
function financePreview(){
  const box=$('financePreview');if(!box)return;
  let income=digitValue($('income')?.value),pact=Number(($('pactUF')?.value||'').replace(',','.'));
  let seven=Math.round(Math.min(income*.07,6.3*41252.94));
  box.innerHTML=`<div class="twoitems"><div><small>7 % estimado desde renta imponible</small><strong>${income?money(seven):'Pendiente'}</strong></div><div><small>Plan pactado</small><strong>${pact>0?uf(pact):'Pendiente'}</strong><small>${pact>0?'≈ '+money(pact*41252.94)+' · UF referencial 01/11/2026':''}</small></div></div><p class="tiny">Cálculo ilustrativo con tope imponible; el monto legal efectivo puede requerir revisión.</p>`;
}
function render(){
 let body='',bar=s.stage===0?16:s.stage===1?43:s.stage===2?68:100;
 $('prog').style.width=bar+'%';$('proglabel').textContent='';
 if(s.stage===0){
  const all=['Banmédica','Colmena','Consalud','Cruz Blanca','Esencial','Nueva Masvida','Vida Tres'];
  body=view('Comencemos por tu situación','Solo necesitamos algunos datos para entender tu contrato y comparar otras isapres.',
  `<div class="bubble"><b>¡Hola! Soy ALMA.</b> Te ayudaré a comparar coberturas reales. No necesitas conocer tu 7 %: lo calculamos desde tu renta imponible.</div>
  <div class="financegrid"><div><label class="field" for="age">Edad del titular</label><input id="age" type="number" inputmode="numeric" min="0" max="110" class="input" value="${esc(s.age)}" placeholder="Ej. 42"></div><div><label class="field" for="isapre">Tu isapre actual</label><select id="isapre" class="input">${all.map(x=>`<option ${s.isapre===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div></div>
  <label class="field" for="loads">Edades de tus cargas (si tienes)</label><input id="loads" class="input" value="${esc(s.loads)}" placeholder="Ej.: 12, 5 · o dejar vacío si no tienes cargas"><div class="financegrid"><div><label class="field" for="pactUF">Precio pactado actual (UF)</label><input id="pactUF" class="input" value="${esc(s.pactUF)}" placeholder="Ej.: 6,500" inputmode="decimal"></div><div><label class="field" for="income">Renta imponible mensual ($)</label><input id="income" class="input" inputmode="numeric" value="${esc(s.income)}" placeholder="1.500.000"></div></div>
  <label class="field" for="payment">Total que pagas por tu plan hoy ($)</label><input id="payment" class="input" inputmode="numeric" value="${esc(s.payment)}" placeholder="Ej.: 280.000"><div class="finpreview" id="financePreview"></div>`,NEXT('Elegir clínicas'));
 } else if(s.stage===1){
  const clinics=['Clínica Dávila','Clínica Dávila Vespucio','Clínica Indisa','Clínica Santa María','Clínica RedSalud Santiago','Clínica RedSalud Providencia','Clínica Ciudad del Mar','Clínica Alemana de Temuco','Clínica Las Condes'];
  body=view('¿Qué te interesa conservar o mejorar?','Puedes elegir varias clínicas. ALMA solo buscará opciones en otras isapres.',
  `<div class="bubble">No hay una clínica mejor para todos: importa dónde quieres atenderte y qué estás dispuesto a cambiar.</div><div class="options">${clinics.map(c=>`<button class="chip ${s.clinics.includes(c)?'on':''}" type="button" data-clinic="${esc(c)}">${s.clinics.includes(c)?'✓ ':''}${esc(c)}</button>`).join('')}</div><label class="field" for="other">Otra clínica (opcional)</label><input class="input" id="other" value="${esc(s.other)}" placeholder="Nombre exacto de otra clínica"><label class="field">¿Qué buscas?</label><div class="options">${[['ambas','Ahorrar y mejorar cobertura'],['ahorro','Pagar menos'],['cobertura','Mejorar cobertura'],['clinicas','Más opciones de clínicas']].map(([k,v])=>`<button type="button" data-goal="${k}" class="chip ${s.goal===k?'on':''}">${v}</button>`).join('')}</div>`,BACK+NEXT('Revisar contrato'));
 } else if(s.stage===2){
  body=view('Sube tu plan actual','Muse Spark de Meta leerá el PDF para extraer las coberturas. También puedes ver una demostración ya analizada, sin gastar nuevos créditos.',
  `<div class="bubble"><b>Privacidad:</b> utiliza solo contratos de prueba sin datos personales. El PDF se envía a Meta para su análisis y no se guarda en la Biblioteca de WordPress.</div>
  <label class="file">Seleccionar contrato PDF<input type="file" id="file" accept="application/pdf,.pdf"></label><p class="tiny">PDF hasta 15 MB y 50 páginas. No usar documentos de clientes reales en esta demostración.</p><div class="twocol" style="margin-top:16px"><button type="button" class="primary" id="analyze">Analizar con Muse Spark</button><button type="button" class="ghost" id="demo">Ver demo ya analizada (sin llamada a Meta)</button></div><p class="err" id="operation" role="status"></p>`,BACK);
 } else {
  body=resultView(s.response);
 }
 $('content').innerHTML=body;
 if(s.stage===0){
   ['income','payment'].forEach(id=>{$(id).addEventListener('input',e=>{const elem=e.target;elem.value=formatThousands(elem.value);financePreview()})});
   $('pactUF').addEventListener('input',financePreview);financePreview();
 }
 if(s.stage===1){
   document.querySelectorAll('[data-clinic]').forEach(el=>el.addEventListener('click',()=>{s.other=$('other').value;const c=el.dataset.clinic;s.clinics=s.clinics.includes(c)?s.clinics.filter(x=>x!==c):[...s.clinics,c];render()}));
   document.querySelectorAll('[data-goal]').forEach(el=>el.addEventListener('click',()=>{s.other=$('other').value;s.goal=el.dataset.goal;render()}));
 }
 if($('back'))$('back').onclick=()=>{persist();s.stage=Math.max(0,s.stage-1);render()};
 if($('next'))$('next').onclick=()=>{
   if(s.stage===0){persist();if(!s.age||+s.age<0||+s.age>110)return err('Ingresa una edad válida.','age');if(!s.isapre)return err('Selecciona una isapre.','isapre');if(digitValue(s.income)<=0)return err('Ingresa la renta imponible para calcular tu 7 %.','income');if(s.pactUF && !(+s.pactUF.replace(',','.')>0))return err('Escribe el pactado con coma decimal, por ejemplo 6,500.','pactUF');}
   if(s.stage===1){persist();if(!s.clinics.length&&!s.other.trim())return err('Selecciona al menos una clínica o escribe otra.','other')}
   s.stage++;render();window.scrollTo(0,0);
 };
 if(s.stage===2){$('analyze').onclick=()=>send(false);$('demo').onclick=()=>send(true);}
 if(s.stage===3){$('restart').onclick=()=>{s.stage=0;s.response=null;render()}; const cb=$('contactConsent');if(cb)cb.onchange=()=>{$('contactMessage').textContent=cb.checked?'Esta es solo una demostración: no se envía información a ningún ejecutivo.':''};}
}
async function send(demo){
 const file=$('file')?.files?.[0];
 if(!demo&&!file)return err('Selecciona un PDF para analizar con Meta.');
 const op=$('operation');op.textContent=demo?'Abriendo comparación ya analizada…':'Enviando contrato a Muse Spark…';
 $('analyze').disabled=true;$('demo').disabled=true;
 const fd=new FormData();fd.append('isapre_actual',s.isapre);fd.append('clinicas',JSON.stringify([...s.clinics,...(s.other?[s.other]:[])]));fd.append('objetivo',s.goal);
 fd.append('renta_imponible',String(digitValue(s.income)));fd.append('pactado_uf',s.pactUF.replace(',','.'));fd.append('pago_actual',String(digitValue(s.payment)||''));
 if(!demo)fd.append('pdf',file);
 try{
   const res=await fetch(demo?'/api/demo':'/api/analizar',{method:'POST',body:fd});const data=await res.json();
   if(!res.ok)throw new Error(data.detail||'No se pudo analizar el contrato');
   s.response=data;s.stage=3;render();window.scrollTo(0,0);
 }catch(e){op.textContent='No se completó la operación: '+e.message;$('analyze').disabled=false;$('demo').disabled=false}
}
function metric(title,value){return `<div><small>${esc(title)}</small><strong>${esc(value)}</strong></div>`}
function resultView(response){
 const d=response?.resultado||{}, comp=response?.comparacion||{}, fin=response?.finanzas||{};
 const textList=(data,cap=3)=>Array.isArray(data)?data.slice(0,cap).map(x=>`<p><b>Página ${esc(x.pagina_pdf??'s/d')}:</b> ${esc(x.descripcion??'Sin dato')}</p>`).join(''):'';
 const precio=fin.pactado_uf?uf(fin.pactado_uf):'UF no informada';
 const seven=fin.cotizacion_legal_estimada?.monto_clp_estimado;
 const active=`<div class="currentcard"><div class="matchtop"><span class="tag">Tu plan actual</span><span class="state">${esc(d.estado_verificacion||'Pendiente de revisión')}</span></div><h2>${esc(d.nombre_plan||'Contrato analizado')}</h2><p>${esc(d.isapre||'Isapre no identificada')} · ${esc(d.codigo_plan||'Código no identificado')} · ${esc(d.modalidad||'Modalidad no identificada')}</p><div class="metricbar">${metric('Hospitalaria','Ver red y topes')}${metric('Ambulatoria','Según prestación')}${metric('Urgencias','Según modalidad')}${metric('Pactado actual',precio)}</div><p class="tiny">Pago mensual informado: ${fin.pago_actual_clp?money(fin.pago_actual_clp):'No informado'} · 7 % estimado: ${seven?money(seven):'Pendiente'}</p><details><summary>Ver coberturas y condiciones del contrato</summary><div class="detailcontent"><h4>Hospitalaria</h4>${textList(d.hospitalaria)}<h4>Ambulatoria</h4>${textList(d.ambulatoria)}<h4>Urgencia</h4>${textList(d.urgencia)}<h4>Clínicas</h4>${textList(d.clinicas_preferentes,5)}<h4>Topes y condiciones</h4>${textList(d.topes,6)}${textList(d.observaciones,4)}</div></details></div>`;
 const cards=(comp.alternativas||[]).map((c,i)=>{
   const matches=c.coincidencias.map(m=>`<div class="clinicrow"><b>${esc(m.clinica)}</b><div class="metricbar">${metric('Hospitalaria',m.hospitalaria!=null?m.hospitalaria+' %':'Por verificar')}${metric('Ambulatoria',m.ambulatoria!=null?m.ambulatoria+' %':'Por verificar')}</div></div>`).join('');
   return `<article class="matchcard ${i===0?'featured':''}"><div class="matchtop"><span class="tag">Alternativa de otra isapre ${i+1}</span><span class="state">Coberturas pendientes de validar</span></div><h3>${esc(c.nombre)}</h3><p class="muted">${esc(c.isapre)} · ${esc(c.codigo)} · ${esc(c.modalidad)}</p>${matches}<div class="price"><strong>Precio final pendiente de cálculo</strong><small>No es posible confirmar ahorro sin tarifa, factores y GES.</small></div><details><summary>Ver urgencias y condiciones para comparar</summary><div class="detailcontent"><h4>Urgencias</h4><p>${esc(c.urgencia)}</p><h4>Hospitalaria</h4><p class="multiline">${esc(c.hospitalaria_resumen)}</p><h4>Ambulatoria</h4><p class="multiline">${esc(c.ambulatoria_resumen)}</p></div></details></article>`}).join('');
 const intro=`<div class="eyebrow">ALMA · Comparación inteligente</div><h1 class="hero">Lo que encontró ALMA</h1><p class="lead">Comparación documental basada en el PDF y una muestra de otras isapres. Las diferencias deben contrastarse con los contratos completos.</p>`;
 return intro+`<div class="bubble"><b>${response.demostracion_precargada?'Demostración con extracción previa de Meta':'Extracción nueva generada por Meta'}</b>. La IA no reemplaza la verificación documental. ${esc(comp.estado||'')}</div>`+active+
 `<h2 class="choiceheading">Alternativas de otras isapres</h2>${comp.error?`<div class="warn">${esc(comp.error)}</div>`:''}${cards||'<p class="warn">No encontramos alternativas documentales con coincidencia exacta en las clínicas seleccionadas. No inventaremos una opción.</p>'}`+
 `<div class="notice"><b>Sobre el precio:</b> ${esc(comp.sin_precios||'No se calcularon precios finales.')} ${esc(comp.mensaje_ahorro||'')}<p class="tiny">Los topes por evento y anuales no se comparan como si fueran equivalentes. No mostramos porcentajes como copagos reales.</p></div>`+
 `<h3>¿Quieres que un ejecutivo revise la comparación?</h3><p class="muted">Este prototipo no envía datos ni contactos.</p><label class="checkboxLine"><input id="contactConsent" type="checkbox"><span>Me gustaría recibir una revisión comercial en una versión futura.</span></label><p class="tiny" id="contactMessage"></p><div class="actions"><button id="restart" class="ghost" type="button">Nueva comparación</button></div>`;
}
render();
})();
</script></body></html>
