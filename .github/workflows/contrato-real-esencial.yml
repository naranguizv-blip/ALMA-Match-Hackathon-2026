name: Leer contrato real Esencial con Muse (fuentes públicas)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contrato-real-esencial.yml'

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar lector
        run: python -m pip install requests
      - name: Analizar PDF real con Muse Spark
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python scripts/analizar_contrato_esencial_real.py
      - name: Guardar JSON privado para verificación
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: extraccion-esencial-pendiente-revision
          path: resultados/extraccion_esencial_real.json
          retention-days: 3
