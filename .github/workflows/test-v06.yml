name: Pruebas ALMA Match v0.6
on:
  pull_request:
    branches:
      - main
      - desarrollo/muse-pdf-v0.5
      - desarrollo/comparador-visual-v0.6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Probar sin consumir créditos Meta
        run: python -m pytest -q
