name: Prueba manual Muse Spark con PDF ficticio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Descargar solo el repositorio de prueba
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install requests reportlab
      - name: Verificar que existe la clave (sin mostrarla)
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [ -z "$MODEL_API_KEY" ]; then
            echo "::error::Falta el secreto MODEL_API_KEY. Configúralo en Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Analizar PDF de prueba mediante Meta
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: python scripts/prueba_meta_pdf.py
